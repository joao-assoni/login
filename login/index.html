  <main>
    <form>
      <h1>login.</h1>
      <div>
      <input type="text" class="form-control" id="user" aria-describedby="emailHelp" placeholder="Email or username" required>
      </div>
      <div>
      <input type="password" class="form-control" id="password" placeholder="Password" required>
      </div>
      <button type="submit" class="submit_btn" id="submit">Submit</button>
      <p><a href="../register/register.html" class="create_new" id="create_new">Create new account</a></p>
    </form>
  </main>
